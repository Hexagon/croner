name: Publish to NPM
permissions:
  contents: read
  id-token: write
on:
  release:
    types: [released]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the exact code referenced by the release tag
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      - run: npm run build
      
      - run: npm publish
